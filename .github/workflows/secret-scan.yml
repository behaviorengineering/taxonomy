# Secret scan via open-source gitleaks CLI (MIT). Do not use gitleaks/gitleaks-action
# on org repos (Gitleaks LLC commercial license / GITLEAKS_LICENSE).
# Also enable GitHub secret scanning + push protection via prepare script when the plan allows.

name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks detect
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose
