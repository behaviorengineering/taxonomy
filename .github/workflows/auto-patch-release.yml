# Auto patch release (agent-oriented)
#
# On every push to main, create vX.Y.(Z+1) and publish a source GitHub Release
# via GoReleaser, unless scripts/auto-patch-decide.sh skips (docs/chore/ci,
# harness-only paths, packaging-only, or [skip release]).
#
# Manual bump (minor/major/patch): workflow_dispatch.

name: Auto patch release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump level
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to tag
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BUMP: ${{ github.event.inputs.bump }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: bash scripts/auto-patch-decide.sh

      - name: Skip notice
        if: steps.decide.outputs.skip == 'true'
        run: echo "Skipping auto release: ${{ steps.decide.outputs.reason }}"

      - uses: actions/setup-go@v5
        if: steps.decide.outputs.skip != 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Create and push tag
        if: steps.decide.outputs.skip != 'true'
        env:
          NEW_TAG: ${{ steps.decide.outputs.new_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
          git push origin "refs/tags/${NEW_TAG}"

      - uses: goreleaser/goreleaser-action@v6
        if: steps.decide.outputs.skip != 'true'
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
